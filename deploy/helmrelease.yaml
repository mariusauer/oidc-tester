apiVersion: v1
kind: Namespace
metadata:
  name: oidc-tester
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bjw-s
  namespace: oidc-tester
spec:
  interval: 1h
  url: https://bjw-s-labs.github.io/helm-charts
---
# Before reconciling this HelmRelease, create an oidc-tester-config Secret in
# this namespace with a config.json key matching the format in config.json.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oidc-tester
  namespace: oidc-tester
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        # Login state is held in-process, so overlapping replicas would make
        # callbacks fail intermittently with "invalid state".
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              # Publish this image/tag first or replace the repository; this
              # source repository currently publishes binaries, not images.
              repository: ghcr.io/mariusauer/oidc-tester
              tag: v1.1.1
              pullPolicy: IfNotPresent
            workingDir: /
            ports:
              - name: http
                containerPort: 3000
                protocol: TCP
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /health
                port: http
              readiness:
                enabled: true
                type: HTTP
                path: /health
                port: http
              startup:
                enabled: true
                type: HTTP
                path: /health
                port: http
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              runAsGroup: 65532
              runAsNonRoot: true
              runAsUser: 65532
              seccompProfile:
                type: RuntimeDefault

    defaultPodOptions:
      automountServiceAccountToken: false

    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
            targetPort: http

    ingress:
      main:
        enabled: true
        # Default class created by the haproxytech/kubernetes-ingress chart.
        className: haproxy
        hosts:
          - host: oidc-tester.example.com
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - oidc-tester.example.com
            secretName: oidc-tester-tls

    persistence:
      config:
        type: secret
        name: oidc-tester-config
        items:
          - key: config.json
            path: config.json
        advancedMounts:
          main:
            app:
              - path: /config.json
                subPath: config.json
                readOnly: true
