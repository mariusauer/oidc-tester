apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oidc-tester

resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml

secretGenerator:
  - name: oidc-tester-config
    files:
      - config.json

generatorOptions:
  # The HelmRelease references this exact name, and Reloader handles updates.
  disableNameSuffixHash: true
