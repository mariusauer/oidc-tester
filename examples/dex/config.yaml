# Local development only. All state is discarded when Dex restarts.
issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

staticClients:
  - id: oidc-tester
    name: OIDC Tester
    secret: oidc-tester-dev-secret
    redirectURIs:
      - http://localhost:3000/callback

enablePasswordDB: true
staticPasswords:
  - email: admin@example.com
    # bcrypt hash of "password", from Dex's example configuration.
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: admin
    userID: 08a8684b-db88-4b73-90a9-3cd1661f5466
    groups:
      - admins
      - oidc-testers
